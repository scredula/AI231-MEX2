# Command Classifier Validation Configuration
# Usage: python validate.py --config configs/command_val.yaml --model runs/command/<exp>/<ts>/best_model.onnx

experiment:
  name: "command_mex2_val"
  output_dir: "runs/command_val"
  seed: 42
  device: "cpu"

data:
  manifest: "data/command/manifest.csv"
  class_names: "data/command/labels.json"
  audio_root: "data/command"
  split_column: "split"

audio:
  sample_rate: 16000
  clip_duration: 2.0
  n_fft: 400
  hop_length: 160
  win_length: 400
  n_mels: 64
  f_min: 0
  f_max: 8000
  power: 2.0
  normalized: false
  normalize: true
  mean: null
  std: null

augmentation:
  enabled: false

dataloader:
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: false

model:
  type: "matchboxnet"
  input_channels: 1
  n_mels: 64
  num_classes: 32
  stem_channels: 96
  stem_kernel_size: 11
  stem_stride: 2
  blocks:
    - channels: 96
      kernel_size: 11
      dilation: 1
      num_blocks: 3
      dropout: 0.1
    - channels: 192
      kernel_size: 13
      dilation: 1
      num_blocks: 3
      dropout: 0.1
    - channels: 384
      kernel_size: 15
      dilation: 1
      num_blocks: 2
      dropout: 0.1
  head_dropout: 0.2

validation:
  thresholds: [0.1, 0.5, 0.9]
  compute_confusion_matrix: true
  compute_per_class_metrics: true
  benchmark:
    enabled: true
    num_runs: 500
    warmup_runs: 100
    batch_sizes: [1, 4, 16]

logging:
  tensorboard: false
  csv_log: true
  save_plots: true
